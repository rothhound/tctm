name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**']
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w apps/api

      - name: Unit & integration tests
        run: npm test -w apps/api
